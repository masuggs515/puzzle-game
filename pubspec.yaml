name: puzzle_game
description: "Word and logic puzzle mobile game."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.22.0

  # Backend
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.1

  # Navigation
  go_router: ^14.3.0

  # Analytics
  mixpanel_flutter: ^2.3.4

  # Monetization
  purchases_flutter: ^8.4.0

  # Ads
  google_mobile_ads: ^5.1.0
  app_tracking_transparency: ^2.0.6+1

  # Push notifications
  onesignal_flutter: ^5.2.10

  # Crash reporting
  sentry_flutter: ^9.0.0

  # Local storage
  shared_preferences: ^2.3.2

  # Animations
  flutter_animate: ^4.5.0

  # Utilities
  uuid: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/puzzles/
    - assets/word_lists/
    - assets/word_lists/category_lists/
    - assets/fonts/

  fonts:
    - family: SpecialElite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Light.ttf
          weight: 300
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
        - asset: assets/fonts/CourierPrime-Italic.ttf
          style: italic
